<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>抽背 · 甜酷课堂</title>
    <!-- 引入 Space Grotesk 字体，打造现代科技感 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- 引入 Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
      /* ========== 全局重置 ========== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Space Grotesk', sans-serif;
        user-select: none; /* 禁止选中文字，避免抽取时误选 */
      }

      /* ========== 页面主体背景 ========== */
      body {
        min-height: 100vh;
        /* 深紫到暗黑的径向渐变，营造神秘甜酷氛围 */
        background: radial-gradient(circle at 30% 20%, #2a0a3a, #0d0018 70%);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
        color: #fff;
        position: relative;
        overflow-x: hidden;
      }

      /* 背景网格装饰层 */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* 使用线性渐变绘制细网格，粉色带透明 */
        background-image: linear-gradient(rgba(255, 105, 200, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 105, 200, 0.04) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
      }

      /* 背景星星点缀 */
      body::after {
        content: '✦ ✧ ✦ ✧ ✦';
        position: fixed;
        top: 10%;
        left: 5%;
        font-size: 1.4rem;
        color: #ff99dd;
        opacity: 0.25;
        letter-spacing: 30px;
        text-shadow: 0 0 20px #ff69b4;
        pointer-events: none;
        z-index: 1;
        transform: rotate(-5deg);
      }

      /* ========== 主卡片容器 ========== */
      .container {
        width: 100%;
        max-width: 1200px;
        /* 半透明深紫背景，加上毛玻璃效果 */
        background: rgba(20, 8, 30, 0.75);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 150, 220, 0.5);
        border-radius: 48px;
        box-shadow:
          0 20px 40px rgba(0, 0, 0, 0.8),
          0 0 60px rgba(255, 105, 200, 0.3);
        padding: 28px 32px 40px;
        position: relative;
        z-index: 2;
        transition: all 0.2s;
      }

      /* 卡片左上角爱心装饰 */
      .container::before {
        content: '♡';
        position: absolute;
        top: -10px;
        right: 40px;
        font-size: 3rem;
        color: #ff9ef0;
        opacity: 0.3;
        text-shadow: 0 0 30px #ff69b4;
        transform: rotate(15deg);
        pointer-events: none;
      }

      /* 卡片右下角星星装饰 */
      .container::after {
        content: '✧';
        position: absolute;
        bottom: 20px;
        left: 30px;
        font-size: 2.5rem;
        color: #ffb3ff;
        opacity: 0.25;
        text-shadow: 0 0 30px #ff69b4;
        transform: rotate(-10deg);
        pointer-events: none;
      }

      /* ========== 头部区域 ========== */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
        flex-wrap: wrap;
        gap: 16px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo i {
        font-size: 2.4rem;
        color: #ff9ef0;
        text-shadow:
          0 0 20px #ff69b4,
          0 0 40px #ff69b4;
      }

      .logo h1 {
        font-weight: 700;
        font-size: 2rem;
        /* 粉色渐变文字效果 */
        background: linear-gradient(135deg, #ffb3ff, #ff69b4, #ffb3ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.5px;
        text-shadow: 0 0 30px rgba(255, 105, 200, 0.6);
      }

      /* 班级标签（显示当前班级） */
      .class-badge {
        background: #ff69b4;
        color: #fff;
        font-weight: 700;
        font-size: 1rem;
        padding: 8px 22px;
        border-radius: 40px;
        text-transform: uppercase;
        letter-spacing: 2px;
        box-shadow:
          0 0 20px #ff69b4,
          0 0 40px #ff69b4;
        border: 1px solid #fff3;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .class-badge i {
        font-size: 1rem;
      }

      /* ========== 抽取展示区域（学生 / 课文） ========== */
      .draw-area {
        display: flex;
        flex-wrap: wrap;
        gap: 30px;
        justify-content: center;
        margin-bottom: 24px;
      }

      /* 每一张卡片（学生、课文） */
      .draw-card {
        flex: 1 1 240px;
        min-width: 240px;
        background: rgba(30, 10, 30, 0.6);
        border-radius: 36px;
        padding: 24px 18px;
        text-align: center;
        border: 1.5px solid rgba(255, 150, 220, 0.5);
        box-shadow:
          inset 0 0 30px rgba(255, 150, 220, 0.15),
          0 8px 20px rgba(0, 0, 0, 0.6);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        backdrop-filter: blur(6px);
      }

      /* 鼠标悬停时卡片上浮 + 光效增强 */
      .draw-card:hover {
        box-shadow:
          inset 0 0 40px rgba(255, 150, 220, 0.3),
          0 0 40px rgba(255, 105, 200, 0.5);
        transform: translateY(-5px);
      }

      /* 卡片标题文字 */
      .draw-label {
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 4px;
        color: #ffb3ff;
        font-weight: 600;
        margin-bottom: 16px;
        text-shadow: 0 0 12px #ff69b4;
      }

      /* 抽取结果显示的大字 */
      .draw-name {
        font-size: 3rem;
        font-weight: 700;
        line-height: 1.3;
        min-height: 5rem;
        word-break: break-word;
        background: linear-gradient(135deg, #fff, #ffb3ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 20px #ff69b4);
        transition: all 0.2s;
      }

      /* 副标题 */
      .draw-sub {
        font-size: 0.9rem;
        color: #cc9fcc;
        margin-top: 12px;
        letter-spacing: 1px;
      }

      /* 课文卡片文字略小 */
      .draw-card.text-card .draw-label {
        color: #ffb3ff;
        text-shadow: 0 0 12px #ff69b4;
      }

      .draw-card.text-card .draw-name {
        background: linear-gradient(135deg, #fff, #ffb3ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 20px #ff69b4);
        font-size: 2.2rem;
      }

      /* ========== 悬浮倒计时 ========== */
      .countdown-overlay {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 999;
        display: none; /* 默认隐藏，通过 JS 添加 active 显示 */
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .countdown-overlay.active {
        display: flex;
      }

      /* 倒计时圆形徽章 */
      .countdown-badge {
        background: rgba(20, 0, 20, 0.9);
        backdrop-filter: blur(20px);
        border: 2px solid #ff9ef0;
        border-radius: 50%;
        width: 180px;
        height: 180px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 0 40px #ff69b4,
          0 0 80px rgba(255, 105, 200, 0.6),
          inset 0 0 40px rgba(255, 105, 200, 0.3);
        animation: countdownPulse 0.8s infinite alternate; /* 呼吸灯效果 */
        position: relative;
      }

      /* 旋转的虚线圆环 */
      .countdown-badge::before {
        content: '';
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        border: 2px dashed rgba(255, 150, 220, 0.7);
        animation: spinRing 4s linear infinite;
      }

      @keyframes spinRing {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* 徽章的脉冲动画 */
      @keyframes countdownPulse {
        0% {
          box-shadow:
            0 0 40px #ff69b4,
            0 0 80px rgba(255, 105, 200, 0.6),
            inset 0 0 40px rgba(255, 105, 200, 0.3);
          border-color: #ff9ef0;
          transform: scale(1);
        }
        100% {
          box-shadow:
            0 0 60px #ff69b4,
            0 0 120px rgba(255, 105, 200, 0.9),
            inset 0 0 60px rgba(255, 105, 200, 0.5);
          border-color: #fff;
          transform: scale(1.05);
        }
      }

      /* 倒计时数字 */
      .countdown-number {
        font-size: 5rem;
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(135deg, #fff, #ffb3ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 25px #ff69b4);
      }

      /* 倒计时下方文字 */
      .countdown-text {
        color: #ffb3ff;
        font-weight: 600;
        letter-spacing: 2px;
        font-size: 0.9rem;
        margin-top: 4px;
        text-transform: uppercase;
        text-shadow: 0 0 12px #ff69b4;
      }

      /* 遮罩层（倒计时出现时背景变暗） */
      .overlay-mask {
        position: fixed;
        inset: 0;
        background: rgba(20, 0, 20, 0.7);
        backdrop-filter: blur(4px);
        z-index: 998;
        display: none;
        opacity: 0;
        transition: opacity 0.25s;
      }

      .overlay-mask.active {
        display: block;
        opacity: 1;
      }

      /* 抽取进行中，卡片脉冲动画 */
      .draw-card.active-draw {
        animation: pulse 0.6s infinite alternate;
      }

      @keyframes pulse {
        0% {
          box-shadow:
            inset 0 0 30px rgba(255, 150, 220, 0.2),
            0 0 20px rgba(255, 105, 200, 0.4);
          border-color: #ff9ef0;
        }
        100% {
          box-shadow:
            inset 0 0 60px rgba(255, 105, 200, 0.5),
            0 0 60px #ff69b4,
            0 0 80px #ff69b4;
          border-color: #fff;
        }
      }

      /* ========== 按钮区域 ========== */
      .action-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin: 24px 0 30px;
      }

      /* 通用按钮样式 */
      .btn {
        background: rgba(40, 10, 40, 0.8);
        border: 1.5px solid;
        border-radius: 60px;
        padding: 16px 36px;
        font-size: 1.2rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 1px;
        backdrop-filter: blur(8px);
        color: #fff;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      }

      /* 按钮禁用状态 */
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: scale(0.98);
      }

      /* 主按钮（抽学生） */
      .btn-primary {
        border-color: #ff9ef0;
        box-shadow: 0 0 25px rgba(255, 105, 200, 0.6);
        text-shadow: 0 0 10px #ff69b4;
      }

      .btn-primary:hover:not(:disabled) {
        background: rgba(255, 105, 200, 0.2);
        box-shadow:
          0 0 45px #ff69b4,
          0 0 70px #ff69b4;
        transform: scale(1.03);
        border-color: #fff;
      }

      /* 次按钮（抽课文） */
      .btn-secondary {
        border-color: #d48aff;
        box-shadow: 0 0 25px rgba(212, 138, 255, 0.6);
        text-shadow: 0 0 10px #d48aff;
      }

      .btn-secondary:hover:not(:disabled) {
        background: rgba(212, 138, 255, 0.2);
        box-shadow:
          0 0 45px #d48aff,
          0 0 70px #d48aff;
        transform: scale(1.03);
        border-color: #fff;
      }

      .btn:active:not(:disabled) {
        transform: scale(0.98);
      }

      .btn i {
        font-size: 1.3rem;
      }

      /* ========== 底部历史提示 Toast ========== */
      .history-toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #1a001add;
        backdrop-filter: blur(16px);
        border-left: 6px solid #ff69b4;
        padding: 12px 24px;
        border-radius: 16px;
        color: #ffccff;
        font-weight: 500;
        box-shadow: 0 0 30px #ff69b4;
        z-index: 1100;
        display: flex;
        align-items: center;
        gap: 12px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .history-toast.show {
        opacity: 1;
      }

      /* ========== 自定义滚动条 ========== */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #1a001a;
      }
      ::-webkit-scrollbar-thumb {
        background: #ff69b4;
        border-radius: 10px;
      }

      /* ========== 移动端适配 ========== */
      @media (max-width: 680px) {
        .container {
          padding: 20px 16px 30px;
        }
        .logo h1 {
          font-size: 1.5rem;
        }
        .draw-name {
          font-size: 2.2rem;
        }
        .draw-card.text-card .draw-name {
          font-size: 1.6rem;
        }
        .btn {
          padding: 12px 22px;
          font-size: 1rem;
        }
        .countdown-badge {
          width: 140px;
          height: 140px;
        }
        .countdown-number {
          font-size: 3.5rem;
        }
        .class-badge {
          font-size: 0.85rem;
          padding: 6px 16px;
        }
      }
    </style>
  </head>
  <body>
    <!-- 遮罩层（倒计时时显示，使背景变暗） -->
    <div class="overlay-mask" id="overlayMask"></div>

    <!-- 悬浮倒计时（固定在屏幕中央） -->
    <div class="countdown-overlay" id="countdownOverlay">
      <div class="countdown-badge">
        <span class="countdown-number" id="countdownNumber">3</span>
        <span class="countdown-text">秒后揭晓</span>
      </div>
    </div>

    <!-- 主容器 -->
    <div class="container">
      <!-- 头部：Logo + 班级标签 -->
      <div class="header">
        <div class="logo">
          <i class="fas fa-crown"></i>
          <h1>抽背</h1>
        </div>
        <!-- 班级标签，动态显示当前班级 -->

      </div>

      <!-- 抽取展示区 -->

          <div class="draw-name" id="studentDisplay">?</div>
          <div class="draw-sub" id="studentSub">点击抽取幸运儿</div>
        </div>
        <!-- 抽课文卡片 -->
        <div class="draw-card text-card" id="textCard">
          <div class="draw-label"><i class="fas fa-book-open"></i> 抽课文</div>
          <div class="draw-name" id="textDisplay">?</div>
          <div class="draw-sub">随机篇目</div>
        </div>
      </div>

      <!-- 操作按钮区 -->
      <div class="action-bar">
        <button class="btn btn-primary" id="drawStudentBtn"><i class="fas fa-dice-d6"></i> 抽学生</button>
        <button class="btn btn-secondary" id="drawTextBtn"><i class="fas fa-feather-alt"></i> 抽课文</button>
      </div>
    </div>

    <!-- 底部历史提示 Toast -->
    <div class="history-toast" id="historyToast">
      <i class="fas fa-history"></i>
      <span id="toastMsg">抽取记录</span>
    </div>

      // ========== 课文库 ==========
      // 目前用数字 1~7 代表课文，可以改成具体的课文名称

      // 当前学生池（根据 URL 中的 class 参数动态填充）

      const overlayMask = document.getElementById('overlayMask'); // 背景遮罩
      const studentCard = document.getElementById('studentCard'); // 学生卡片
      const textCard = document.getElementById('textCard'); // 课文卡片
      const classLabel = document.getElementById('classLabel'); // 班级标签文字

      // ========== 状态变量 ==========
      let isDrawing = false; // 是否正在抽取（防止重复点击）
      let countdownInterval = null; // 倒计时定时器 ID

      // ========== 工具函数 ==========

      /**
       * 显示底部提示条
       * @param {string} msg - 要显示的消息
       */
      function showToast(msg) {
        toastMsg.innerText = msg;
        historyToast.classList.add('show');
        // 清除之前的定时器，避免多个定时器冲突
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => {
          historyToast.classList.remove('show');
        }, 1800); // 1.8秒后自动隐藏
      }

      /**
       * 加权随机抽取学生
       * 根据每个学生的 prob 权重决定抽中概率
       * @returns {Object} 被抽中的学生对象 { name, prob }
       */
      function pickStudentByWeight() {
        if (!students.length) return { name: '无学生', prob: 0 };

        // 计算总权重
        const totalWeight = students.reduce((sum, s) => sum + (s.prob > 0 ? s.prob : 0), 0);

        // 如果总权重为0或负数，则退化为等概率随机
        if (totalWeight <= 0) {
          return students[Math.floor(Math.random() * students.length)];
        }

        // 生成一个 [0, totalWeight) 的随机数
        let random = Math.random() * totalWeight;

        // 遍历学生，累减权重，直到随机数落在某个区间
        for (let s of students) {
          const w = s.prob > 0 ? s.prob : 0;
          if (random < w) return s;
          random -= w;
        }

        // 兜底：返回最后一个学生（理论上不会执行到这里）
        return students[students.length - 1];
      }

      /**
       * 随机抽取课文（等概率）
       * @returns {*} 被抽中的课文
       */
      function pickRandomText() {
        if (!texts.length) return '无课文';
        return texts[Math.floor(Math.random() * texts.length)];
      }

      // ========== 倒计时控制 ==========

      /**
       * 显示倒计时悬浮层
       * 重置数字为3，显示遮罩，激活卡片脉冲动画
       */
      function showCountdown() {
        countdownNumber.innerText = '3';
        overlayMask.classList.add('active');
        countdownOverlay.classList.add('active');
        studentCard.classList.add('active-draw');
        textCard.classList.add('active-draw');
      }

      /**
       * 隐藏倒计时悬浮层
       * 移除遮罩、悬浮层、卡片脉冲动画，清除定时器
       */
      function hideCountdown() {
        overlayMask.classList.remove('active');
        countdownOverlay.classList.remove('active');
        studentCard.classList.remove('active-draw');
        textCard.classList.remove('active-draw');
        if (countdownInterval) {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }
      }

      /**
       * 启动倒计时
       * @param {number} duration - 倒计时秒数（这里固定为3）
       * @param {Function} callback - 倒计时结束后执行的回调函数
       */
      function startCountdown(duration, callback) {
        // 清除之前的定时器，确保每次从3开始
        if (countdownInterval) {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }

        let remaining = duration;
        countdownNumber.innerText = remaining;
        showCountdown(); // 显示倒计时界面
        countdownNumber.innerText = remaining;

        // 每秒更新一次
        countdownInterval = setInterval(() => {
          remaining -= 1;
          if (remaining >= 0) {
            countdownNumber.innerText = remaining;
          }
          if (remaining <= 0) {
            // 倒计时结束
            clearInterval(countdownInterval);
            countdownInterval = null;
            hideCountdown(); // 隐藏倒计时界面
            callback(); // 执行抽取回调
          }
        }, 1000);
      }

      // ========== 抽取动作 ==========

      /**
       * 抽学生（带倒计时动画）
       */
      function drawStudentWithCountdown() {
        // 防止重复点击
        if (isDrawing) return;
        // 检查是否有学生数据
        if (students.length === 0) {
          studentDisplay.innerText = '🚫';
          studentSub.innerText = '没有学生数据';
          showToast('⚠️ 学生池为空');
          return;
        }

        // 锁定状态，禁用按钮
        isDrawing = true;
        drawStudentBtn.disabled = true;
        drawTextBtn.disabled = true;

        // 设置待定状态
        studentDisplay.innerText = '?';
        studentSub.innerText = '倒计时中…';

        // 启动3秒倒计时，结束后执行抽取
        startCountdown(3, () => {
          const picked = pickStudentByWeight();
          studentDisplay.innerText = picked.name;
          studentSub.innerText = `被抽中啦 · 准备背诵`;
          showToast(`👤 抽中学生：${picked.name}`);
          console.log('抽中学生:', picked);

          // 恢复状态，启用按钮
          isDrawing = false;
          drawStudentBtn.disabled = false;
          drawTextBtn.disabled = false;
        });
      }

      /**
       * 抽课文（带倒计时动画）
       */
      function drawTextWithCountdown() {
        if (isDrawing) return;
        if (texts.length === 0) {
          textDisplay.innerText = '📭';
          showToast('⚠️ 课文库为空');
          return;
        }

        isDrawing = true;
        drawStudentBtn.disabled = true;
        drawTextBtn.disabled = true;

        textDisplay.innerText = '?';

        startCountdown(3, () => {
          const pickedText = pickRandomText();
          textDisplay.innerText = pickedText;
          showToast(`📖 抽中课文：${pickedText}`);
          console.log('抽中课文:', pickedText);

          isDrawing = false;
          drawStudentBtn.disabled = false;
          drawTextBtn.disabled = false;
        });
      }

      /**
       * 初始化函数
       * 读取 URL 中的 class 参数，加载对应班级学生，绑定事件
       */
      function init() {
        // 解析 URL 查询参数
        const urlParams = new URLSearchParams(window.location.search);
        const classParam = urlParams.get('class');

        // 根据 class 参数选择学生名单
        if (classParam === '25') {
          students = [...CLASS_25_STUDENTS];
          classLabel.innerText = '25班';
        } else if (classParam === '27') {
          students = [...CLASS_27_STUDENTS];
          classLabel.innerText = '27班';
        } else {
          // 未指定或无效参数，默认使用25班
          students = [...CLASS_25_STUDENTS];
          classLabel.innerText = '25班';
          console.warn('未指定 class 参数（25或27），默认使用25班');
        }

        // 更新副标题显示学生总数
        studentSub.innerText = `共 ${students.length} 位学生 · 点击抽取`;

        // 绑定按钮点击事件
        drawStudentBtn.addEventListener('click', drawStudentWithCountdown);
        drawTextBtn.addEventListener('click', drawTextWithCountdown);

        // 在控制台输出当前班级信息，方便调试
        console.log(`当前班级：${classLabel.innerText}，学生数：${students.length}`);
      }

      window.addEventListener('DOMContentLoaded', init);
