name: Deploy # workflow 的名称
on: [push] # 触发条件
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
      - name: Prepare site 📦
        run: |
          mkdir -p dist
          cp index.html dist/
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
